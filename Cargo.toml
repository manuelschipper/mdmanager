[package]
name = "mdmanager"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
license = "MIT"
description = "Manage your CLAUDE.md and AGENTS.md across machines and runtimes"
repository = "https://github.com/manuelschipper/mdmanager"
homepage = "https://mdmanager.ai"
publish = false

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
glob = "0.3"
indexmap = { version = "2", features = ["serde"] }
pulldown-cmark = { version = "=0.13.0", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
tempfile = "3"
toml = { version = "1.1", features = ["preserve_order"] }
toml_edit = "0.25"
unicode-width = "0.2"
walkdir = "2"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
nix = { version = "0.30", features = ["term", "poll"] }

# Keep dev and test identical so `cargo build`, `cargo run`, and `cargo test`
# share one artifact set, and keep debuginfo off so linked test binaries stay
# small. Do not override these through CARGO_PROFILE_* or CARGO_INCREMENTAL
# environment variables: each distinct value makes Cargo build a full second
# copy of the workspace under the same target directory.
[profile.dev]
debug = 0

[profile.test]
debug = 0
